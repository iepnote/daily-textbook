<html lang="ko">

<title>매일매일 국어</title>
<style>
/* 매일매일 국어 앱 스타일 v5(앱 ver 6: 선생님 모드를 대시보드 · 학생 상세로 — 설계_대시보드_v1) — 색은 토큰(var(--mk-…))으로만. 토큰 정의는 build_app.py 가 이 파일 뒤에 붙인다 */
@import url("https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css");
html,body{margin:0;padding:0;height:100%}
body{font-family:'NanumSquareNeo','NanumSquare Neo','NanumSquareNeoOTF','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  color:var(--mk-ink);background:var(--mk-outside);overflow:hidden}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;background:var(--mk-card);
  display:flex;flex-direction:column;overflow:hidden}
.nav{flex:0 0 auto;display:flex;gap:.5rem;align-items:center;justify-content:flex-end;min-height:56px;padding:0 .9rem;
  background:var(--mk-card);border-bottom:1px solid var(--mk-line)}
.nav .brand{margin-right:auto;font-size:1.3rem;font-weight:800;color:var(--mk-dark)}
.nav button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;height:40px;padding:0 .9rem;font-size:1.1rem;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;line-height:1.15;   /* 이모지가 든 단추(📅 달력 · 🏠 홈)의 글자가 아래로 내려가지 않게 — 줄 높이 고정 */
  color:var(--mk-ink);background:var(--mk-btn)}
.wrap{flex:1 1 auto;min-height:0;width:100%;max-width:1240px;margin:0 auto;padding:.6rem 1.2rem;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column}
.wrap > :first-child{margin-top:auto}
.wrap > :last-child{margin-bottom:auto}
.card{background:var(--mk-card);border:3px solid var(--mk-edge);border-radius:24px;padding:1.2rem 1.4rem;box-shadow:var(--mk-shadow);text-align:center}
.big{font-size:1.6rem;font-weight:800;line-height:1.5;word-break:keep-all}
.sub{font-size:1.15rem;color:var(--mk-ink2);margin-top:.2rem}
.msg{min-height:1.6em;margin-top:.6rem;font-size:1.1rem;font-weight:700;color:var(--mk-bad)}
.btn{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:.6rem 1.4rem;font-size:1.2rem;font-weight:800;
  color:var(--mk-ink);background:var(--mk-btn)}
.btn--main{color:var(--mk-card);background:var(--mk-dark)}
input[type=text],input[type=password],select{font-family:inherit;font-size:1.2rem;font-weight:700;color:var(--mk-ink);background:var(--mk-card);
  border:2px solid var(--mk-line);border-radius:12px;padding:.5rem .7rem;box-sizing:border-box}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--mk-light);outline-offset:2px}
/* ── 첫 화면: 매일수학 .pickwrap 과 같은 크기·글자(폭 1188.8px = 매일수학 .wrap 안쪽 폭) ── */
.pickwrap{position:relative;width:min(1188.8px,100%);height:640px;margin:auto;display:flex;border-radius:24px;overflow:hidden;
  background:var(--mk-card);box-shadow:var(--mk-shadow)}
.pickhero{position:relative;flex:0 0 430px;box-sizing:border-box;background:var(--mk-main);color:var(--mk-card);display:flex;flex-direction:column;
  justify-content:center;gap:1rem;padding:2.4rem 2.8rem;text-align:left}
.ph-school{font-size:1.15rem;font-weight:800;color:var(--mk-tint)}
.ph-title{font-size:3.5rem;font-weight:800;line-height:1.15}
.ph-sub{font-size:1.15rem;color:var(--mk-tint)}
.pickhero .notice{position:absolute;left:2.8rem;right:2.8rem;bottom:1.1rem;font-size:.82rem;font-weight:700;line-height:1.4;word-break:keep-all;color:var(--mk-card)}
.pickside{flex:1;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  padding:1.4rem 2.4rem;text-align:center}
.pk-head{font-size:1.85rem;font-weight:800}
.pickside input#in-code{width:100%;max-width:380px;text-align:center;font-size:1.7rem;letter-spacing:.35em;text-transform:uppercase;
  border:2px solid var(--mk-line);border-radius:16px;padding:.55rem 1rem;outline:none;box-shadow:var(--mk-shadow)}
.pickside input#in-code::placeholder{text-transform:none}
.pickside input#in-code:focus{border-color:var(--mk-main)}
.pickside .btn{border-radius:16px}
.pickside .btn--main{box-shadow:var(--mk-shadow)}
.pickside #btn-teacher{color:var(--mk-ink2)}
.pickside .msg{margin-top:0}
.pickside .msg:empty{display:none}
.pickside .note{box-sizing:border-box;max-width:460px;margin-top:.6rem;padding:.6rem .8rem;background:var(--mk-soft);border:1px solid var(--mk-line);
  border-radius:.8rem;color:var(--mk-ink2);font-size:1.02rem;line-height:1.5;text-align:center}
.pickwrap .credit{position:absolute;right:18px;bottom:10px;max-width:60%;text-align:right;line-height:1.3;font-size:.78rem;color:var(--mk-ink2)}
.row{display:flex;gap:.8rem;justify-content:center}
/* ── 학생 고르기: 매일수학 .pickwrap 안의 왼쪽 판 + 이름 단추와 같은 크기 ── */
.ph-stlabel{font-size:.95rem;font-weight:800;color:var(--mk-tint);margin-top:.7rem}
.ph-stamps{display:flex;gap:.55rem}
.ph-stamps .st{box-sizing:border-box;width:42px;height:42px;border-radius:50%;border:3px dashed var(--mk-light);display:flex;align-items:center;justify-content:center}
.ph-stamps .st.on{border:none;background:var(--mk-star);color:var(--mk-card)}
.pk-top{display:flex;gap:.5rem;justify-content:flex-end;width:100%}
.pkbtn{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:.45rem .95rem;font-size:1.1rem;font-weight:800;color:var(--mk-card);box-shadow:var(--mk-shadow)}
.pkbtn.quitc{background:var(--mk-bad)}
.pkbtn.setc{background:var(--p-pu)}
.pk-body{flex:1;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:1rem}
.pk-body > :first-child{margin-top:auto}
.pk-body > :last-child{margin-bottom:auto}
.pickgrid{display:grid;grid-template-columns:minmax(320px,380px);gap:.9rem;justify-content:center}
.pickgrid.two{grid-template-columns:repeat(2,minmax(280px,330px))}
.pk{display:flex;align-items:center;gap:.9rem;min-width:0;font-family:inherit;cursor:pointer;background:var(--mk-card);border:2px solid var(--mk-line);
  border-radius:1.2rem;padding:.75rem 1.2rem;box-shadow:var(--mk-shadow);color:var(--mk-ink);text-align:left}
.pk.done{border-color:var(--mk-ok);background:var(--mk-tint)}
.pk .face{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--mk-light) center/cover no-repeat;color:var(--mk-dark);display:flex;align-items:center;
  justify-content:center;font-size:1.7rem;font-weight:800}
.pk .col{display:flex;flex-direction:column;align-items:flex-start;gap:.05rem;min-width:0}
.pk .nm{font-size:1.8rem;font-weight:800}
.pk .tg{font-size:1rem;color:var(--mk-ink2)}
.pk .ok{font-size:.95rem;font-weight:800;color:var(--mk-ok)}
/* ── 단원 고르기 ── */
.chip{background:var(--mk-tint);color:var(--mk-dark);border-radius:12px;padding:.3rem .8rem;font-size:1.05rem;font-weight:800}
.wrap > .units{margin:0;flex:1 1 auto}
.voltabs{display:flex;gap:.5rem}
.voltab{font-family:inherit;cursor:pointer;border:2px solid var(--mk-line);background:var(--mk-card);color:var(--mk-ink);border-radius:12px;
  padding:.45rem 1.1rem;font-size:1.15rem;font-weight:800}
.voltab.on{background:var(--mk-dark);border-color:var(--mk-dark);color:var(--mk-card)}
.unit{margin-top:.8rem;text-align:left}
.unit-h{font-size:1.1rem;font-weight:800;color:var(--mk-ink2);margin-bottom:.4rem}
.unit-b{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.pbtn{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-family:inherit;cursor:pointer;background:var(--mk-card);
  border:2px solid var(--mk-line);border-radius:16px;padding:.8rem 1rem;box-shadow:var(--mk-shadow);color:var(--mk-ink);text-align:left}
.pbtn .pt{font-size:1.3rem;font-weight:800;word-break:keep-all}
.pbtn .ps{flex:0 0 auto;font-size:1rem;font-weight:700;color:var(--mk-dark);background:var(--mk-tint);border-radius:10px;padding:.15rem .55rem}
.pbtn[disabled]{opacity:.45;cursor:default}
/* ── 읽기: 틀이 무대를 꽉 채운다 ── */
#stage > iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;z-index:100;background:var(--mk-card)}
.wrap.busy{opacity:.5;pointer-events:none}
/* ── 완료 화면 · 달력 ── */
.calcard{position:relative;width:100%;max-width:720px;margin-left:auto;margin-right:auto;box-sizing:border-box}
.calband{background:var(--mk-dark);color:var(--mk-card);font-weight:800;font-size:1.05rem;border-radius:12px;padding:.45rem 1rem;margin-bottom:.7rem}
.praiseimg{height:160px}
.kidface{width:150px;height:150px;object-fit:cover;border-radius:22px;border:3px solid var(--mk-dark);display:block;margin:0 auto;box-shadow:var(--mk-shadow)}
.cheerstamp{position:absolute;top:24px;left:calc(100% - 90px);height:200px;transform:rotate(11deg);animation:stampDrop .7s cubic-bezier(.2,1.4,.4,1) both;z-index:5}
@keyframes stampDrop{0%{transform:rotate(11deg) scale(2.6);opacity:0}55%{transform:rotate(11deg) scale(.88);opacity:1}75%{transform:rotate(11deg) scale(1.1)}100%{transform:rotate(11deg) scale(1)}}
.streak{color:var(--mk-dark)}
.monthnav{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.5rem 0}
.mtitle{font-size:1.4rem;font-weight:800;min-width:150px}
.mgap{width:104px}
.mbtn{font-family:inherit;cursor:pointer;border:none;background:var(--mk-btn);color:var(--mk-ink);border-radius:12px;padding:.4rem 1rem;font-size:1.1rem;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:480px;margin:.6rem auto 0}
.cal-h{text-align:center;font-weight:700;color:var(--mk-card);background:var(--mk-dark);border-radius:8px;padding:.3rem 0;font-size:1.15rem}
.cal-h.rest{background:var(--mk-bad)}
.cal-d{position:relative;aspect-ratio:1;display:grid;place-items:center;font-size:1.5rem;border-radius:50%}
.cal-d .dnum{position:relative;z-index:1}
.cal-d.done{font-weight:800}
.cal-d.done::after{content:'';position:absolute;left:50%;top:50%;width:86%;height:86%;transform:translate(-50%,-50%);background:var(--mk-star);border-radius:50%;z-index:0}
.cal-d.today{font-weight:900;outline:3px solid var(--mk-main);outline-offset:-3px}
.calcard.fin .praiseimg{height:80px}
.calcard.fin .cal-grid{max-width:370px;gap:4px}
.calcard.fin .cal-d{font-size:1.2rem}
.calcard.fin .calband{margin-bottom:.4rem}
.calcard.fin .monthnav{display:none}
.scorepop{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:120;background:var(--mk-card);border:6px solid var(--mk-dark);
  border-radius:22px;padding:1rem 1.8rem;box-shadow:var(--mk-shadow);text-align:center;font-weight:800;font-size:1.3rem;color:var(--mk-dark);
  animation:scoreStay 3s ease forwards;pointer-events:none}
.scorepop .score{font-size:2.6rem;margin-top:.2rem}
@keyframes scoreStay{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  18%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(.95)}}
/* ── 선생님 모드 ── */
.tlogin{max-width:460px;width:100%;margin-left:auto;margin-right:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:.8rem;align-items:center}
.tlogin label{display:flex;flex-direction:column;gap:.3rem;font-weight:700;text-align:left;width:320px}
.tin{text-align:center;text-transform:uppercase}
/* ── 대시보드 · 학생 상세: 매일수학 .statrow · .stat · .tag · .mini · .sess 와 같은 크기(색은 국어 토큰) ── */
.nav button.on{color:var(--mk-card);background:var(--mk-dark)}
.wrap > .dash{margin:0;width:100%;box-sizing:border-box;text-align:left}
.statrow{display:flex;gap:.8rem;align-items:stretch;flex-wrap:wrap;margin-bottom:.8rem}
.stat{background:var(--mk-tint);border:2px solid var(--mk-edge);border-radius:1rem;padding:.5rem 1.1rem;min-width:130px}
.stat .k{font-size:.9rem;color:var(--mk-ink2);font-weight:700}
.stat .v{font-size:1.5rem;font-weight:800;color:var(--mk-dark)}
.stat .v.code{letter-spacing:.25em}
.stat select{display:block;font-size:1rem;padding:.3rem .4rem;margin-top:.2rem}
.statrow .grow{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.dtable{width:100%;border-collapse:collapse;font-size:1.05rem}
.dtable th,.dtable td{padding:.5rem;border-bottom:1px solid var(--mk-line);text-align:left;vertical-align:middle}
.dtable th{color:var(--mk-ink2);font-size:.95rem;font-weight:700}
.dtable td select{font-size:1rem;padding:.3rem .4rem}
.tag{display:inline-block;font-size:.9rem;font-weight:800;padding:.15rem .7rem;border-radius:999px}
.tag.on{background:var(--mk-tint);color:var(--mk-ok)}
.tag.off,.tag.dim{background:var(--mk-btn);color:var(--mk-ink2)}
.tag.mid{background:var(--mk-read);color:var(--mk-ink)}
.tag.low{background:var(--mk-bad-bg);color:var(--mk-bad)}
.mini{display:inline-flex;gap:3px}
.mini i{width:10px;height:10px;border-radius:3px;background:var(--mk-line)}
.mini i.on{background:var(--mk-main)}
.dim{color:var(--mk-ink2);font-size:.9rem}
.btn-sm{padding:.3rem .8rem;font-size:1rem}
.dash .note{font-size:1rem;color:var(--mk-ink2);background:var(--mk-soft);border:1px solid var(--mk-line);border-radius:.8rem;padding:.6rem .8rem;margin-top:.6rem;line-height:1.5}
.dash .msg:empty{display:none}
.dhead{display:flex;align-items:center;gap:1rem;margin-bottom:.8rem}
.dname{font-size:1.4rem;font-weight:800}
.dsec{font-size:1.15rem;font-weight:800;margin:1rem 0 .4rem}
.tybar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.5rem}
.ty{background:var(--mk-card);border:2px solid var(--mk-edge);border-radius:.8rem;padding:.4rem .5rem;text-align:center}
.ty.few{opacity:.5}
.ty .k{font-size:.95rem;font-weight:800;color:var(--mk-ink2)}
.ty .v{font-size:1.3rem;font-weight:800;color:var(--mk-dark)}
.ty .bar{height:6px;border-radius:3px;background:var(--mk-btn);overflow:hidden;margin:.2rem 0}
.ty .bar i{display:block;height:6px;background:var(--mk-main)}
.ty .bar i.mid{background:var(--mk-star)}
.ty .bar i.low{background:var(--mk-bad)}
.sess{border:2px solid var(--mk-edge);border-radius:.9rem;padding:.4rem .8rem;margin:.4rem 0}
.sess summary{cursor:pointer;font-size:1.05rem;padding:.25rem 0}
.itemtbl{width:100%;border-collapse:collapse;margin:.4rem 0 .2rem;font-size:.98rem}
.itemtbl th,.itemtbl td{padding:.3rem .5rem;border-bottom:1px solid var(--mk-line);text-align:left;vertical-align:top}
.itemtbl th{color:var(--mk-ink2);font-weight:700}
.morebtn{text-align:center;margin-top:.5rem}
.hidden{display:none}

:root{--mk-main:#43A047;--mk-dark:#2E7D32;--mk-light:#A5D6A7;--mk-tint:#E8F5E9;--mk-ink:#2D3436;--mk-ink2:#616161;--mk-card:#FFFFFF;--mk-soft:#F6F5F2;--mk-line:#D9DEE5;--mk-outside:#1B1B1F;--mk-edge:#C9DCCB;--mk-btn:#F1F3F6;--mk-ok:#2E7D32;--mk-bad:#C62828;--mk-bad-bg:#FDECEA;--mk-star:#FFB300;--mk-read:#FFE066;--mk-read-edge:#F9A825;--k-who-bg:#FDE7E7;--k-who:#C62828;--k-when-bg:#F1E6FA;--k-when:#6A1B9A;--k-where-bg:#DDF3EF;--k-where:#00796B;--k-what-bg:#E3EEFB;--k-what:#1565C0;--k-why-bg:#FCEBD5;--k-why:#B85C00;--k-how-bg:#FBE4EE;--k-how:#AD1457;--p-rd-bg:#FDE7E7;--p-rd:#C62828;--p-or-bg:#FCEBD5;--p-or:#B85C00;--p-yl-bg:#FBF3C4;--p-yl:#7A5C00;--p-tl-bg:#DDF3EF;--p-tl:#00796B;--p-bl-bg:#E3EEFB;--p-bl:#1565C0;--p-nv-bg:#E4E7F8;--p-nv:#303F9F;--p-pu-bg:#F1E6FA;--p-pu:#6A1B9A;--p-pk-bg:#FBE4EE;--p-pk:#AD1457;--p-br-bg:#EFE5DC;--p-br:#6D4C41;--p-gy-bg:#E5EBEF;--p-gy:#455A64;--mk-shadow:0 4px 12px rgba(0,0,0,.10);}
</style>

  <div class="nav" id="nav"></div>

<script>
/* ── 10_core.js ── */
/* 10 상수 · 저장 · 무대 · 음성 — 골뱅이 두 개로 감싼 자리는 work/build_app.py 가 채운다(서버 주소·앱 열쇠는 매일수학 설정에서).

const LS = 'mk1:';

/* 고정 무대 1280×720 — 통째로 확대·축소(매일수학 04_stage 와 같은 방식) */
function fitStage() {
  const st = $('stage'); if (!st) return;
  const sc = Math.min(innerWidth / 1280, innerHeight / 720);
  st.style.transform = 'translate(' + (innerWidth - 1280 * sc) / 2 + 'px,' + (innerHeight - 720 * sc) / 2 + 'px) scale(' + sc + ')';

  list.push(row); if (list.length > SESSQ_MAX) list.splice(0, list.length - SESSQ_MAX);

}
const sessKey = r => r.id + '|' + r.finished_at;   // 줄의 「판」 — 같은 풀이(id)라도 도장 때의 줄과 끝날 때의 줄은 다른 판이다
function unqueue(keys) { lsSet('sessq', lsGet('sessq', []).filter(x => !keys.has(sessKey(x)))); }   // 그 판만 기기에서 뺀다(같은 id 의 더 새 판 · 그 사이에 더해진 줄은 남는다)
/* 한 줄 보내기 — 먼저 기기에 두고 보낸다(보내는 동안 창이 닫히거나 연결이 매달려도 줄이 남는다). 올라가면 그 판만 기기에서 뺀다.
   실패하면 기기에 그대로 둔다 · 표가 없으면(404) 표시를 세운다 · 서버가 영영 받지 않는 줄(409 — 지워진 학생 · 교실의 기록)은 버린다 */
function sendSession(row) {
  queueSession(row);
  recChain = recChain.then(async () => {
    try { await Api.saveSession(row); noSess = false; unqueue(new Set([sessKey(row)])); }
    catch (e) { if (e.message === '서버 404') noSess = true; else if (e.message === '서버 409') unqueue(new Set([sessKey(row)])); }
  });
  return recChain;
}
/* 기기에 둔 줄을 다시 보낸다. 올라간 판과 409 를 받은 판만 빼고 나머지는 남긴다(쌓이는 양은 SESSQ_MAX 로만 막는다) · 표가 없으면(404) 거기서 멈춘다.
   끝에서 큐를 다시 읽어 뺀다 — 보내는 사이에 새로 더해진 줄을 덮지 않는다 */
function flushSessions() {
  recDraftToQueue();
  recChain = recChain.then(async () => {
    const gone = new Set();
    for (const row of lsGet('sessq', [])) {
      try { await Api.saveSession(row); noSess = false; gone.add(sessKey(row)); }
      catch (e) {
        if (e.message === '서버 404') { noSess = true; break; }
        if (e.message === '서버 409') gone.add(sessKey(row));
      }
    }
    if (gone.size) unqueue(gone);
  });
  return recChain;
}

/* 엔진 → 앱 신호. 내 틀이 보낸 것 · 내 주소 · app 표시가 있는 것만. done·exit 는 받은 그 자리에서 틀을 없앤다(첫 것만 쓰인다) */
function onEngine(e) {
  const f = $('eng');
  if (!f || !run || e.source !== f.contentWindow || e.origin !== location.origin) return;
  const d = e.data || {};
  if (d.app !== 'maeil-korean') return;
  if (d.type === 'answer') recAnswer(d);
  else if (d.type === 'stamp') {                              // 도장 시점: 날짜 · 기록을 저장하고 틀은 그대로(색칠하기·상상하기가 이어진다)
    if (!run.stamp) { run.stamp = d; recStamp(d); if (stampOK(d)) saveToday(); }
  } else if (d.type === 'done' || d.type === 'exit') {
    const st = run.stamp; recEnd(d.type, d); closeEngine();
    if (st && stampOK(st)) renderDone(st); else renderUnits();
  } else if (d.type === 'error') console.warn('엔진 오류: ' + String(d.msg || '').slice(0, 200));
}
addEventListener('message', onEngine);

/* 40 완료 화면 — 날짜 저장(도장 시점) · 달력 · 도장 · 점수 · 사진. 달력은 국어 전용(korean_students.completed_dates). 설계 v4 §6 */
let calY = null, calM = null;
function todayStr() { return dayStr(new Date()); }

/* 도장 시점에 오늘 날짜를 더한다. 서버의 지금 줄을 다시 읽어 합치고(다른 기기에서 선생님이 값을 바꿨을 수 있다) 날짜 칸만 쓴다 */
async function saveToday() {
  const sid = current.id, code = klass.code, day = todayStr();
  let row = kmap[sid];
  try { const fresh = await Api.getKorean(code, sid); if (fresh) row = kmap[sid] = fresh; } catch (e) { }
  const have = kOf(row).dates;
  if (have.includes(day)) return;                            // 하루에 여러 편을 해도 한 번
  const dates = addDate(have, day);
  kmap[sid] = Object.assign({ student_id: sid, class_code: code }, row || {}, { completed_dates: dates });
  try { await Api.saveKorean({ student_id: sid, class_code: code, completed_dates: dates }); }
  catch (e) { const u = lsGet('unsaved', []); u.push({ sid, code, day }); lsSet('unsaved', u); }   // 못 쓴 날짜는 기기에 두었다가 다음에 다시
}
async function flushUnsaved() {
  const u = lsGet('unsaved', []);
  if (!u.length) return;
  const left = [];
  for (const j of u) {
    try {
      const dates = addDate(kOf(await Api.getKorean(j.code, j.sid)).dates, j.day);
      await Api.saveKorean({ student_id: j.sid, class_code: j.code, completed_dates: dates });
      if (klass && klass.code === j.code) kmap[j.sid] = Object.assign({ student_id: j.sid, class_code: j.code }, kmap[j.sid] || {}, { completed_dates: dates });
    } catch (e) { left.push(j); }
  }
  lsSet('unsaved', left);
}

      ${atCurrent ? '<span class="mgap"></span>' : '<button class="mbtn mnext" onclick="changeMonth(1)">다음달 ▶</button>'}</div>
    <div class="cal-grid">${cells}</div></div>`;
  if (justFinished) photoFor(current.name).then(p => {         // 한글놀이터에 등록한 사진이 있으면 그림 대신 사진

  });

}

}

/* ── 50_teacher.js ── */
/* 50 선생님 모드 — 로그인 · 학생 설정 고르기 칸(kSel) · 한 칸 저장(saveK). 화면은 52_dash.js(대시보드) · 54_detail.js(학생 상세) — 설계_대시보드_v1 §2
   로그인은 매일수학과 같다(교실 코드 + 비밀번호의 SHA-256 을 classes.pin_hash 와 견준다 — 확인은 기기에서만). 학생 추가·삭제·이름 바꾸기는 매일수학에서 한다 */
async function sha256(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {                                              // 보안 연결이 아닐 때 매일수학이 쓰는 간이 해시와 같은 꼴
    let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
    return 'x' + h.toString(16);
  }
}
function renderTeacherLogin(msg) {
  setNav('<span class="brand">🔒 선생님 모드</span>');
  $('wrap').innerHTML = `<div class="card tlogin"><div class="big">선생님 로그인</div>
    <label>교실 코드<input id="t-code" class="tin" type="text" maxlength="6" autocomplete="off" value="${esc(device.classCode)}"></label>
    <label>비밀번호<input id="t-pin" class="tin" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')tryTeacherLogin()"></label>
    <div class="row"><button class="btn btn--main" id="btn-tlogin" onclick="tryTeacherLogin()">들어가기</button>
      <button class="btn" onclick="leaveTeacher()">← 돌아가기</button></div>
    <div class="msg" id="msg">${esc(msg || '')}</div>
    <div class="sub">매일매일 수학의 선생님 비밀번호와 같아요.<br>교실 만들기 · 학생 추가 · 이름 바꾸기는 매일매일 수학에서 해요.</div></div>`;
}
function leaveTeacher() { teacherOK = ''; if (klass) renderStudentPick(); else renderStart(); }
async function tryTeacherLogin() {
  const code = val('t-code').toUpperCase(), pin = val('t-pin');
  if (!code || !pin) { warn('교실 코드와 비밀번호를 넣어 주세요.'); return; }
  let ok = false;
  try { ok = await loadClass(code); } catch (e) { warn('서버에 연결하지 못했어요. 인터넷을 확인해 주세요.'); return; }
  if (!ok) { klass = null; warn('교실을 찾을 수 없어요.'); return; }
  if (await sha256(pin) !== klass.pin_hash) { klass = null; warn('비밀번호가 달라요.'); return; }
  teacherOK = code; device.classCode = code; saveDevice();
  renderDashboard();
}
const K_LABEL = { level: '읽기 수준', follow: '따라 읽기 수준', hint: '색 힌트', extra: '마무리 활동' };
/* 학생 설정 한 칸의 고르기 — 고르면 그 칸만 바로 저장한다(대시보드 표 · 학생 상세가 함께 쓴다) */
function kSel(sid, k, list, cur, off) {
  return `<select data-sid="${esc(sid)}" data-k="${k}" aria-label="${K_LABEL[k]}"${off ? ' disabled' : ''} onchange="saveK(this.dataset.sid, this)">` +
    list.map(v => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('') + '</select>';
}
/* 고른 칸 하나만 저장한다(다른 칸·날짜를 덮지 않게) */
async function saveK(sid, el) {
  if (!klass || teacherOK !== klass.code) return;
  const k = el.dataset.k, row = { student_id: sid, class_code: klass.code };
  row[k] = el.value;
  try {
    await Api.saveKorean(row);
    kmap[sid] = Object.assign({ student_id: sid, class_code: klass.code }, kmap[sid] || {}, row); warn('');
  } catch (e) { warn('저장하지 못했어요. 인터넷을 확인해 주세요.'); el.value = kOf(kmap[sid])[k]; }
}

/* ── 52_dash.js ── */
/* 52 대시보드 첫 화면 — 위쪽 줄 · 통계 줄 · 학생 표(매일수학 09_teacher.js 의 renderDashboard 와 같은 짜임). 설계_대시보드_v1 §2-1 · §2-2
   「오늘」·「최근 7일」= 달력 도장(korean_students.completed_dates) · 정답률 = 최근 7일의 기록(첫 시도에 맞은 수 ÷ 채점 문항 수) */
let navSeq = 0;                                    // 선생님 화면을 그리기 시작할 때마다 +1 — 받는 사이에 다른 화면을 그리기 시작했으면 늦게 온 응답은 버린다
function teacherNav(cur) {
  const where = [klass.school, klass.name].filter(Boolean).map(esc).join(' ') || '우리 교실';
  return `<span class="brand">📋 ${where} · 선생님</span>
    <button id="btn-dash" class="${cur === 'dash' ? 'on' : ''}" onclick="renderDashboard()">대시보드</button>
    <button id="btn-tback" onclick="leaveTeacher()">🧒 학생 화면</button>
    <button id="btn-tquit" onclick="quitTeacher()">🚪 나가기</button>`;
}
function quitTeacher() { teacherOK = ''; renderStart(); }
function rateTag(r) { return `<span class="tag ${rateClass(r)}">${r === null ? '기록 없음' : r + '%'}</span>`; }
async function renderDashboard() {
  if (!klass || teacherOK !== klass.code) { renderTeacherLogin(); return; }
  const code = klass.code, my = ++navSeq;
  setNav(teacherNav('dash'));
  $('wrap').innerHTML = '<div class="card"><div class="big">불러오는 중…</div></div>';
  let sessions = [], failed = false;
  try {
    const [st, ks, ss] = await Promise.all([Api.listStudents(code), Api.listKorean(code), Api.listSessions(code, { since: daysAgo(6, new Date()) })]);
    if (my !== navSeq || !klass || teacherOK !== code) return;   // 받는 사이에 나갔거나 다른 화면으로 갔다
    students = st; kmap = {}; ks.forEach(r => { kmap[r.student_id] = r; }); sessions = ss;
  } catch (e) { failed = true; }
  if (my !== navSeq || !klass || teacherOK !== code) return;
  const now = new Date(), t = dayStr(now), week = daysAgo(6, now), wk = sessions.filter(s => s.sdate >= week), wkRate = rateOf(wk);
  const doneToday = students.filter(s => kOf(kmap[s.id]).dates.includes(t)).length;
  const rows = students.map(s => {
    const k = kOf(kmap[s.id]), on = k.dates.includes(t);
    const last7 = [...Array(7)].map((_, i) => `<i class="${k.dates.includes(daysAgo(6 - i, now)) ? 'on' : ''}"></i>`).join('');
    return `<tr data-sid="${esc(s.id)}"><td><b>${esc(s.name)}</b>${s.tag ? `<br><span class="dim">${esc(s.tag)}</span>` : ''}</td>
      <td><span class="tag ${on ? 'on' : 'off'}">${on ? '읽음' : '아직'}</span></td>
      <td><span class="mini">${last7}</span><br><span class="dim">누적 ${k.dates.length}일</span></td>
      <td class="rate">${rateTag(rateOf(wk.filter(x => x.student_id === s.id)))}</td>
      <td>${kSel(s.id, 'level', LEVELS, k.level)}</td>
      <td><button class="btn btn-sm" data-sid="${esc(s.id)}" onclick="renderStudentDetail(this.dataset.sid)">상세</button></td></tr>`;
  }).join('');
  $('wrap').innerHTML = `<div class="card dash">
    <div class="statrow">
      <div class="stat" id="st-today"><div class="k">오늘 읽음</div><div class="v">${doneToday} / ${students.length}명</div></div>
      <div class="stat" id="st-week"><div class="k">최근 7일 정답률</div><div class="v">${wkRate === null ? '—' : wkRate + '%'}</div></div>
      <div class="stat"><div class="k">교실 코드</div><div class="v code">${esc(code)}</div></div>
      <div class="grow"><button class="btn btn-sm" id="btn-refresh" onclick="renderDashboard()">🔄 새로고침</button></div>
    </div>
    <table class="dtable"><thead><tr><th>이름</th><th>오늘</th><th>최근 7일</th><th>정답률(7일)</th><th>읽기 수준</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6">아직 학생이 없어요.</td></tr>'}</tbody></table>
    <div class="msg" id="msg">${failed ? '서버에서 받지 못했어요. 인터넷을 확인하고 새로고침을 눌러 주세요.' : ''}</div>
    <div class="note">${noSess ? '<b>서버에 기록 표가 아직 없어요.</b> 기록은 이 기기에 두었다가 표가 생기면 올려요.<br>' : ''}
      정답률 = 첫 시도에 맞은 문항 ÷ 채점 문항(못 풀고 넘어간 문항은 틀린 것으로 세요) · 최근 7일.<br>
      읽기 수준은 고르면 바로 저장돼요. 학생 추가 · 이름 바꾸기는 매일매일 수학에서 해요.</div></div>`;
}

/* ── 54_detail.js ── */
/* 54 학생 상세 — 요약 · 설정 · 유형별 정답률 · 회차별 학습 기록(매일수학 09_teacher.js 의 renderStudentDetail 과 같은 짜임). 설계_대시보드_v1 §2-3
   · 질문 글은 기록에 없다 — 회차를 펼칠 때 그 지문 · 수준의 데이터를 받아 문항표 번호로 찾아 넣는다(받은 것은 이 화면 동안 기억).
   · 유형별 정답률 = 최근 30일 · 문항이 FEW 개 미만이면 흐리게(「자료 적음」)
   · 문항별 표의 번호 = 문항표(xlsx)의 번호 — 학습지에서 뺀 예측 행까지 세므로 학생 화면의 번호와 다르고 건너뛴다. 열 이름을 「문항표 번호」로 밝힌다(교사 결정 2026-11-26 검수) */
let detail = null;                                 // { sid, sessions, qmap: {'지문ID|수준': {번호: 질문 글}} }
const SESS_FIRST = 3, SESS_MAX = 200;
function itemResult(it) {
  if (it.ungraded) return `<span class="tag dim">채점 안 함</span>${it.picked ? ` <span class="dim">고른 답: ${esc(it.picked)}</span>` : ''}`;
  const picked = (it.wrongs || []).length ? ` <span class="dim">고른 답: ${it.wrongs.map(esc).join(', ')}</span>` : '';
  if (it.skipped) return '<span class="tag dim">못 풀고 넘어감</span>' + picked;
  if (it.first === true) return '<span class="tag on">한 번에 정답</span>';
  return `<span class="tag low">오답 ${(it.wrongs || []).length}회</span>` + picked;
}
function sessHtml(x, i) {
  const title = (passages.find(p => p.id === x.passage_id) || {}).title || x.passage_id;
  const items = (x.items || []).slice().sort((a, b) => (a.no == null) - (b.no == null) || (a.no || 0) - (b.no || 0));   // 문항표 번호 차례 · 더한 문제(번호 없음)는 뒤로
  const rows = items.map(it => { const no = typeof it.no === 'number' ? it.no : null; return `<tr><td>${no == null ? '—' : no}</td><td>${esc(it.k || '—')}${it.infer ? ' <span class="dim">추론</span>' : ''}</td>
    <td class="qt" data-no="${no == null ? '' : no}">${it.user ? '더한 문제' : '…'}</td><td>${itemResult(it)}</td><td>${it.ms ? Math.round(it.ms / 1000) + '초' : '—'}</td></tr>`; }).join('');
  return `<details class="sess" data-i="${i}" ontoggle="if(this.open)fillQuestions(this)">
    <summary><b>${esc(fmtDay(x.sdate))}</b> · ${esc(title)} · <span class="dim">${esc(x.level)} 수준</span> ·
      <span class="tag ${rateClass(pct(Number(x.first_try) || 0, Number(x.total) || 0))}">${Number(x.first_try) || 0} / ${Number(x.total) || 0}</span>${x.state === '도중' ? ' <span class="tag dim">도중에 나감</span>' : ''} ·
      <span class="dim">${fmtDur(x.duration_ms)}</span></summary>
    <table class="itemtbl"><thead><tr><th>문항표 번호</th><th>유형</th><th>질문</th><th>결과</th><th>시간</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}
/* 펼친 회차의 질문 칸 채우기 — 그 지문 · 수준의 데이터를 받아 번호로 찾는다. 못 받거나 번호가 없으면 「질문을 찾지 못함」 */
async function fillQuestions(el) {
  if (!detail || el.dataset.filled) return;
  el.dataset.filled = '1';
  const mine = detail, x = mine.sessions[Number(el.dataset.i)]; if (!x) return;
  const key = x.passage_id + '|' + x.level;
  if (!mine.qmap[key]) { try { mine.qmap[key] = qTextMap(await Api.getLevel(x.passage_id, x.level)); } catch (e) { mine.qmap[key] = {}; } }
  if (detail !== mine) return;                                  // 받는 사이에 다른 화면으로 갔다
  el.querySelectorAll('td.qt').forEach(td => {
    if (td.dataset.no === '') { if (td.textContent === '…') td.textContent = '—'; return; }
    td.textContent = mine.qmap[key][td.dataset.no] || '질문을 찾지 못함';
  });
}
async function renderStudentDetail(sid) {
  if (!klass || teacherOK !== klass.code) { renderTeacherLogin(); return; }
  const s = students.find(x => x.id === sid); if (!s) { renderDashboard(); return; }
  const code = klass.code, my = ++navSeq;
  setNav(teacherNav('detail'));
  $('wrap').innerHTML = '<div class="card"><div class="big">불러오는 중…</div></div>';
  let sessions = [], failed = false;
  if (!passages.length) { try { passages = await Api.listPassages(); } catch (e) { } }   // 못 받으면 제목 대신 지문ID 로 보인다(기록은 그대로 받는다)
  try { sessions = await Api.listSessions(code, { studentId: sid, items: true, limit: SESS_MAX }); } catch (e) { failed = true; }
  if (my !== navSeq || !klass || teacherOK !== code) return;   // 받는 사이에 나갔거나 다른 화면으로 갔다
  detail = { sid, sessions, qmap: {} };
  const now = new Date(), k = kOf(kmap[sid]), week = daysAgo(6, now), month = daysAgo(29, now);
  const r7 = rateOf(sessions.filter(x => x.sdate >= week)), types = byType(sessions.filter(x => x.sdate >= month));
  const band = types.some(t => t.n) ? types.map(t => `<div class="ty${t.few ? ' few' : ''}" data-k="${t.k}"><div class="k">${t.k}</div>
      <div class="v">${t.rate === null ? '—' : t.rate + '%'}</div><div class="bar"><i class="${rateClass(t.rate)}" style="width:${t.rate || 0}%"></i></div>
      <div class="dim">${t.n}문항${t.few && t.n ? ' · 자료 적음' : ''}</div></div>`).join('') : '';
  const all = sessions.map((x, i) => { try { return sessHtml(x, i); } catch (e) { return '<div class="note">기록 한 줄을 보이지 못했어요.</div>'; } });
  const list = all.length ? all.slice(0, SESS_FIRST).join('') + (all.length > SESS_FIRST ?
      `<div id="more-sess" class="hidden">${all.slice(SESS_FIRST).join('')}</div>
       <div id="more-btn" class="morebtn"><button class="btn btn-sm" onclick="$('more-sess').classList.remove('hidden');$('more-btn').remove()">… 더보기 (지난 기록 ${all.length - SESS_FIRST}개)</button></div>` : '')
    : '<div class="note">아직 학습 기록이 없어요.</div>';
  $('wrap').innerHTML = `<div class="card dash detail" data-sid="${esc(sid)}">
    <div class="dhead"><button class="btn btn-sm" id="btn-back-dash" onclick="renderDashboard()">← 대시보드</button>
      <span class="dname">${esc(s.name)}${s.tag ? ` <span class="dim">(${esc(s.tag)})</span>` : ''}</span></div>
    <div class="statrow">
      <div class="stat"><div class="k">누적 읽은 날</div><div class="v">${k.dates.length}일</div></div>
      <div class="stat" id="st-rate"><div class="k">정답률(7일)</div><div class="v">${r7 === null ? '—' : r7 + '%'}</div></div>
      <div class="stat"><div class="k">읽기 수준</div>${kSel(sid, 'level', LEVELS, k.level)}</div>
      <div class="stat"><div class="k">따라 읽기 수준</div>${kSel(sid, 'follow', FOLLOWS, k.follow, noFollow)}</div>
      <div class="stat"><div class="k">색 힌트</div>${kSel(sid, 'hint', HINTS, k.hint)}</div>
      <div class="stat"><div class="k">마무리 활동</div>${kSel(sid, 'extra', EXTRAS, k.extra)}</div>
    </div>
    <div class="msg" id="msg">${failed ? '서버에서 받지 못했어요. 인터넷을 확인해 주세요.' : ''}</div>
    <div class="dsec">유형별 정답률 <span class="dim">(최근 30일 · 문항이 ${FEW}개보다 적으면 흐리게)</span></div>
    ${band ? `<div class="tybar">${band}</div>` : '<div class="note" id="ty-none">기록 쌓는 중이에요.</div>'}
    <div class="dsec">학습 기록 <span class="dim">(누르면 문항별로 펼쳐져요 · 최근 ${SESS_MAX}회까지)</span></div>
    ${list}
    <div class="note">따라 읽기 수준: 같게 = 읽기 수준과 같게 · 낱말 = 낱말 하나씩 · 문장 = 한 줄씩 · 문단 = 한 문장씩${noFollow ? ' — <b>서버에 이 칸이 아직 없어 고를 수 없어요.</b>' : ''}<br>
      색 힌트: 색 = 색 면 · 밑줄 = 밑줄만 · 없음 = 표시 없음<br>
      마무리 활동: 모두 = 인물 잇기 → 이야기 차례(있는 지문만) → 선잇기 → 낱말 완성 → 도장 → 기억력 카드 → 색칠하기 → 상상하기<br>
      마무리 활동: 도장까지 = 낱말 완성까지 · 없음 = 문항만<br>
      고르면 바로 저장돼요. 정답률 = 첫 시도에 맞은 문항 ÷ 채점 문항(못 풀고 넘어간 문항은 틀린 것으로 세요).</div></div>`;
}

/* ── 99_boot.js ── */
/* 99 시작 */
fitStage();
if (typeof boot === 'function') boot();
else { setNav('<span class="brand">매일매일 국어</span>'); $('wrap').innerHTML = '<div class="card"><div class="big">' + APP_VERSION + '</div></div>'; }
